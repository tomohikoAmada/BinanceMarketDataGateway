name: Gateway foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/foundation-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMD_GATEWAY_BUILD_TESTS=ON
          -DBMD_GATEWAY_BUILD_UPSTREAM_LINK_SMOKE=OFF
      - name: Build
        run: cmake --build build/foundation-${{ matrix.compiler }} --parallel
      - name: Test
        run: ctest --test-dir build/foundation-${{ matrix.compiler }} --output-on-failure
      - name: CLI lifecycle smoke
        run: >-
          build/foundation-${{ matrix.compiler }}/bmd-gatewayd
          --venue binance --market spot --symbol BTCUSDT
          --grpc-listen 127.0.0.1:50051 --queue-capacity 1024

  sanitizers:
    name: Sanitizer ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/sanitizer-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMD_GATEWAY_BUILD_TESTS=ON
          -DBMD_GATEWAY_ENABLE_ASAN=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }}
          -DBMD_GATEWAY_ENABLE_UBSAN=${{ matrix.sanitizer == 'ubsan' && 'ON' || 'OFF' }}
          -DBMD_GATEWAY_ENABLE_TSAN=${{ matrix.sanitizer == 'tsan' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build/sanitizer-${{ matrix.sanitizer }} --parallel
      - name: Test
        run: ctest --test-dir build/sanitizer-${{ matrix.sanitizer }} --output-on-failure

  format:
    name: C++ format check
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: scripts/format-check.sh
