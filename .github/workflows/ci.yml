name: Gateway CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_dependencies:
        description: Prepare the pinned Linux production binary cache (one-time / dependency changes)
        type: boolean
        default: false
      binary_seed_run:
        description: Optional successful preparation run ID to reuse its binary archive on main
        type: string
        default: ''


permissions:
  contents: read

jobs:
  foundation:
    name: Foundation ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/foundation-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMD_GATEWAY_BUILD_TESTS=ON
          -DBMD_GATEWAY_BUILD_UPSTREAM_LINK_SMOKE=OFF
      - name: Build
        run: cmake --build build/foundation-${{ matrix.compiler }} --parallel
      - name: Test
        run: ctest --test-dir build/foundation-${{ matrix.compiler }} --output-on-failure

  sanitizers:
    name: Sanitizer ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/sanitizer-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMD_GATEWAY_BUILD_TESTS=ON
          -DBMD_GATEWAY_ENABLE_ASAN=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }}
          -DBMD_GATEWAY_ENABLE_UBSAN=${{ matrix.sanitizer == 'ubsan' && 'ON' || 'OFF' }}
          -DBMD_GATEWAY_ENABLE_TSAN=${{ matrix.sanitizer == 'tsan' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build/sanitizer-${{ matrix.sanitizer }} --parallel
      - name: Test
        run: ctest --test-dir build/sanitizer-${{ matrix.sanitizer }} --output-on-failure

  format:
    name: C++ format check
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: scripts/format-check.sh

  production-dependencies:
    name: Prepare production binaries (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      CONAN_HOME: ${{ github.workspace }}/.cache/production-conan
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest==8.4.2'
      - uses: actions/cache/restore@v4
        id: binaries
        with:
          path: .cache/production-conan
          key: production-linux-gcc13-v1-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'scripts/ci/production-dependencies.sh') }}
      - name: Restore prepared binary archive from another branch
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run != ''
        uses: actions/download-artifact@v4
        with:
          name: production-binaries-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'scripts/ci/production-dependencies.sh') }}
          run-id: ${{ inputs.binary_seed_run }}
          github-token: ${{ github.token }}
          path: build/production-binary-seed
      - name: Import binary archive
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run != ''
        run: conan cache restore build/production-binary-seed/production-binaries.tgz
      - name: Prepare pinned binaries only when absent
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run == ''
        run: scripts/ci/production-dependencies.sh prepare
      - name: Verify binary-only resolution
        run: scripts/ci/production-dependencies.sh consume
      - name: Export binaries for main cache initialization
        run: conan cache save '*:*' --no-source --file=build/production-binaries.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: production-binaries-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'scripts/ci/production-dependencies.sh') }}
          path: build/production-binaries.tgz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          path: .cache/production-conan
          key: ${{ steps.binaries.outputs.cache-primary-key }}

  production:
    name: Production Release / four-product offline
    needs: production-dependencies
    if: always() && (needs.production-dependencies.result == 'skipped' || needs.production-dependencies.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONAN_HOME: ${{ github.workspace }}/.cache/production-conan
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'conan==2.31.2'
      - name: Restore pinned binaries (no source fallback)
        uses: actions/cache/restore@v4
        with:
          path: .cache/production-conan
          key: production-linux-gcc13-v1-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'scripts/ci/production-dependencies.sh') }}
          fail-on-cache-miss: true
      - name: Resolve offline binaries
        run: scripts/ci/production-dependencies.sh consume
      - name: Configure production graph
        run: >-
          cmake -S . -B build/production -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/production-deps/conan_toolchain.cmake
          -DBMD_GATEWAY_BUILD_PRODUCTION_DAEMON=ON
          -DBMD_GATEWAY_BUILD_TESTS=ON
          -DBMD_GATEWAY_BUILD_UPSTREAM_LINK_SMOKE=OFF
      - name: Build real daemon and offline tests
        run: cmake --build build/production --parallel 4
      - name: Production offline regression
        run: ctest --test-dir build/production --output-on-failure
