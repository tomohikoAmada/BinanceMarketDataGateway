name: BMDG CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      prepare_dependencies:
        description: Prepare the pinned Linux BMDG production binary cache (one-time / dependency changes)
        type: boolean
        default: false
      binary_seed_run:
        description: Optional successful BMDG preparation run ID to reuse its binary archive on main
        type: string
        default: ''


permissions:
  contents: read

jobs:
  foundation:
    name: BMDG Foundation ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc-13
            cxx: g++-13
          - compiler: clang
            cc: clang-18
            cxx: clang++-18
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/foundation-${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMDG_BUILD_TESTS=ON
          -DBMDG_BUILD_UPSTREAM_LINK_SMOKE=OFF
      - name: Build
        run: cmake --build build/foundation-${{ matrix.compiler }} --parallel
      - name: Test
        run: ctest --test-dir build/foundation-${{ matrix.compiler }} --output-on-failure

  sanitizers:
    name: BMDG Sanitizer ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan, tsan]
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain identity
        run: |
          "$CXX" --version | head -n 1
          cmake --version | head -n 1
      - name: Configure
        run: >-
          cmake -S . -B build/sanitizer-${{ matrix.sanitizer }}
          -DCMAKE_BUILD_TYPE=Debug
          -DBMDG_BUILD_TESTS=ON
          -DBMDG_ENABLE_ASAN=${{ matrix.sanitizer == 'asan' && 'ON' || 'OFF' }}
          -DBMDG_ENABLE_UBSAN=${{ matrix.sanitizer == 'ubsan' && 'ON' || 'OFF' }}
          -DBMDG_ENABLE_TSAN=${{ matrix.sanitizer == 'tsan' && 'ON' || 'OFF' }}
      - name: Build
        run: cmake --build build/sanitizer-${{ matrix.sanitizer }} --parallel
      - name: Test
        run: ctest --test-dir build/sanitizer-${{ matrix.sanitizer }} --output-on-failure

  format:
    name: C++ format check
    runs-on: ubuntu-24.04
    env:
      CLANG_FORMAT: clang-format-18
    steps:
      - uses: actions/checkout@v4
      - name: clang-format
        run: scripts/format-check.sh

  consumer-tests:
    name: BMDG consumer probe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned client dependencies
        run: python -m pip install 'grpcio==1.81.1' 'protobuf==6.33.5' 'pytest==8.4.2'
      - name: Fetch pinned Contracts generated Python
        run: |
          mkdir -p build/contracts-src/src
          curl -fsSL "https://github.com/tomohikoAmada/BinanceMarketDataContracts/archive/518880bdfa60948c3b65b6b3525d024526995166.tar.gz" -o build/contracts-src.tar.gz
          tar -xzf build/contracts-src.tar.gz -C build
          cp -R build/BinanceMarketDataContracts-*/src/binance_market_data build/contracts-src/src/
      - name: Run consumer probe tests
        env:
          PYTHONPATH: ${{ github.workspace }}/tools:${{ github.workspace }}/build/contracts-src/src
        run: python -m pytest tools/tests -q

  production-dependencies:
    name: Prepare BMDG production binaries (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      CONAN_HOME: ${{ github.workspace }}/.cache/production-conan
      CC: gcc-13
      CXX: g++-13
      BMDG_UPSTREAM_TOKEN: ${{ secrets.BMDG_UPSTREAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Authenticate private upstream reads
        if: env.BMDG_UPSTREAM_TOKEN != ''
        run: |
          git config --global \
            url."https://x-access-token:${BMDG_UPSTREAM_TOKEN}@github.com/tomohikoAmada/BinanceMarketDataContracts.git".insteadOf \
            "https://github.com/tomohikoAmada/BinanceMarketDataContracts.git"
      - run: python -m pip install 'conan==2.31.2' 'protobuf==6.33.5' 'pytest==8.4.2'
      - uses: actions/cache/restore@v4
        id: binaries
        with:
          path: .cache/production-conan
          key: production-linux-gcc13-v1-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'profiles/production-ci-build', 'scripts/ci/production-dependencies.sh') }}
      - name: Restore prepared binary archive from another branch
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run != ''
        uses: actions/download-artifact@v4
        with:
          name: production-binaries-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'profiles/production-ci-build', 'scripts/ci/production-dependencies.sh') }}
          run-id: ${{ inputs.binary_seed_run }}
          github-token: ${{ github.token }}
          path: build/production-binary-seed
      - name: Import binary archive
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run != ''
        run: conan cache restore build/production-binary-seed/production-binaries.tgz
      - name: Prepare pinned binaries only when absent
        if: steps.binaries.outputs.cache-hit != 'true' && inputs.binary_seed_run == ''
        run: scripts/ci/production-dependencies.sh prepare
      - name: Verify binary-only resolution
        run: scripts/ci/production-dependencies.sh consume
      - name: Export binaries for main cache initialization
        run: conan cache save '*:*' --no-source --file=build/production-binaries.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: production-binaries-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'profiles/production-ci-build', 'scripts/ci/production-dependencies.sh') }}
          path: build/production-binaries.tgz
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/cache/save@v4
        if: steps.binaries.outputs.cache-hit != 'true'
        with:
          path: .cache/production-conan
          key: ${{ steps.binaries.outputs.cache-primary-key }}

  production:
    name: BMDG Production Release / four- and twenty-product offline
    needs: production-dependencies
    if: always() && (needs.production-dependencies.result == 'skipped' || needs.production-dependencies.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONAN_HOME: ${{ github.workspace }}/.cache/production-conan
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'conan==2.31.2'
      - name: Restore pinned binaries (no source fallback)
        uses: actions/cache/restore@v4
        with:
          path: .cache/production-conan
          key: production-linux-gcc13-v1-${{ hashFiles('conanfile.py', 'conan.lock', 'profiles/production-ci', 'profiles/production-ci-build', 'scripts/ci/production-dependencies.sh') }}
          fail-on-cache-miss: true
      - name: Resolve offline binaries
        run: scripts/ci/production-dependencies.sh consume
      - name: Configure production graph
        run: >-
          cmake -S . -B build/production -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/build/production-deps/conan_toolchain.cmake
          -DBMDG_BUILD_PRODUCTION_DAEMON=ON
          -DBMDG_BUILD_TESTS=ON
          -DBMDG_BUILD_UPSTREAM_LINK_SMOKE=OFF
      - name: Build real daemon and offline tests
        run: cmake --build build/production --parallel 4
      - name: Production offline regression
        run: |
          set -o pipefail
          ctest --test-dir build/production --output-on-failure 2>&1 | tee build/production-ctest.log
      - name: Install release package
        run: |
          cmake --install build/production --prefix build/production-package
          test -x build/production-package/bin/bmdg
          install -D -m 0755 tools/consume_gateway.py build/production-package/tools/consume_gateway.py
          install -D -m 0644 tools/requirements-client.txt build/production-package/tools/requirements-client.txt
          install -D -m 0644 tools/README.md build/production-package/tools/README.md
          install -D -m 0644 deployment/bmdg-consumer.service build/production-package/deployment/bmdg-consumer.service
          mkdir -p build/production-package/contracts-src/src
          curl -fsSL "https://github.com/tomohikoAmada/BinanceMarketDataContracts/archive/518880bdfa60948c3b65b6b3525d024526995166.tar.gz" -o build/contracts-src.tar.gz
          tar -xzf build/contracts-src.tar.gz -C build
          cp -R build/BinanceMarketDataContracts-*/src/binance_market_data build/production-package/contracts-src/src/
          test -f build/production-package/tools/consume_gateway.py
          test -f build/production-package/contracts-src/src/binance_market_data/gateway/v1/gateway_service_pb2_grpc.py
          file build/production-package/bin/bmdg
          ldd build/production-package/bin/bmdg | tee build/production-package/ldd.txt
          if grep -q 'not found' build/production-package/ldd.txt; then
            echo "unresolved shared library in bmdg" >&2
            exit 1
          fi
          if grep -q 'production-conan' build/production-package/ldd.txt; then
            echo "bmdg links a build-machine Conan cache path" >&2
            exit 1
          fi
          sha256sum build/production-package/bin/bmdg | tee build/production-package/bmdg.sha256
          cp build/production-ctest.log build/production-package/
      - name: Record Projection dependency identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          graph = json.loads(Path("build/production-deps-graph.json").read_text())
          nodes = graph["graph"]["nodes"].values()
          selected = [n for n in nodes
                      if (n.get("ref") or "").startswith("binance-market-data-projection/")]
          if len(selected) != 1:
              raise SystemExit(f"expected exactly one Projection node, got {len(selected)}")
          node = selected[0]
          lines = [
              f"commit={os.environ.get('GITHUB_SHA')}",
              f"projection_ref={node.get('ref')}",
              f"projection_package_id={node.get('package_id')}",
              f"projection_prev={node.get('prev')}",
              f"projection_binary={node.get('binary')}",
              "contracts_python_revision=518880bdfa60948c3b65b6b3525d024526995166",
              "client_grpcio=1.81.1",
              "client_protobuf=6.33.5",
          ]
          text = "\n".join(lines) + "\n"
          Path("build/production-package/dependency-identity.txt").write_text(text)
          print(text)
          PY
          cat build/production-package/dependency-identity.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Record Projection link inputs
        run: |
          python - <<'PY'
          from pathlib import Path

          link = Path("build/production/CMakeFiles/bmdg.dir/link.txt")
          text = link.read_text()
          tokens = [t for t in text.split()
                    if "binance-market-data-projection" in t or "bmd_projection" in t]
          if not tokens:
              raise SystemExit("no Projection link inputs found in bmdg link.txt")
          Path("build/production-package/bmdg-link.txt").write_text(text)
          Path("build/production-package/projection-link-inputs.txt").write_text(
              "\n".join(tokens) + "\n")
          print("\n".join(tokens))
          PY
          cat build/production-package/projection-link-inputs.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Create release archive
        run: |
          cp build/production-deps-graph.json build/production-package/
          tar -C build/production-package -czf "build/bmdg-linux-x86_64-${GITHUB_SHA}.tar.gz" .
          sha256sum "build/bmdg-linux-x86_64-${GITHUB_SHA}.tar.gz" > "build/bmdg-linux-x86_64-${GITHUB_SHA}.tar.gz.sha256"
      - name: Upload Linux release package
        uses: actions/upload-artifact@v4
        with:
          name: bmdg-linux-x86_64-${{ github.sha }}
          path: |
            build/bmdg-linux-x86_64-${{ github.sha }}.tar.gz
            build/bmdg-linux-x86_64-${{ github.sha }}.tar.gz.sha256
          retention-days: 14
          if-no-files-found: error
